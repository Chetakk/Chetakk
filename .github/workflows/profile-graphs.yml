name: profile-graphs

on:
  schedule:
    - cron: "30 19 * * *"   # 01:00 IST, after the nightly contribution mirror
  workflow_dispatch:
  push:
    paths:
      - scripts/**
      - .github/workflows/profile-graphs.yml

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: render graphs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          node scripts/render-activity.mjs
          node scripts/render-languages.mjs

      - name: commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh profile graphs"
            git push
          fi
